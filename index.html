<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>laut.fm Server Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #0b0f19;
            color: #00ff66;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background-image: 
                radial-gradient(circle, rgba(0, 255, 102, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(0, 255, 102, 0.02) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* Server Rack Header / Hintergrund-Optik */
        header {
            background: #111827;
            border-bottom: 2px solid #1f2937;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .server-rack-info {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .server-led {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Hauptbereich */
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 30px auto;
            padding: 0 20px;
        }

        .search-container {
            background: rgba(17, 24, 39, 0.9);
            border: 1px solid #374151;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .search-container h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #f3f4f6;
            letter-spacing: 1px;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            background: #030712;
            border: 1px solid #4b5563;
            padding: 12px 15px;
            color: #00ff66;
            font-size: 1rem;
            border-radius: 4px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #00ff66;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }

        button.search-btn {
            background: #1f2937;
            color: #00ff66;
            border: 1px solid #4b5563;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        button.search-btn:hover {
            background: #374151;
            border-color: #00ff66;
        }

        /* Sender-Liste / Suchergebnisse */
        .station-grid {
            display: grid;
            gap: 15px;
        }

        .station-card {
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid #374151;
            padding: 15px 20px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.2s;
        }

        .station-card:hover {
            border-color: #00ff66;
        }

        .station-info-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .station-logo {
            width: 50px;
            height: 50px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid #4b5563;
        }

        .station-details h3 {
            font-size: 1rem;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .station-details a {
            font-size: 0.8rem;
            color: #60a5fa;
            text-decoration: none;
        }

        .station-details a:hover {
            text-decoration: underline;
        }

        .station-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .action-btn {
            background: transparent;
            border: 1px solid #4b5563;
            color: #9ca3af;
            width: 35px;
            height: 35px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: all 0.2s;
        }

        .action-btn.play {
            color: #00ff66;
            border-color: #00ff66;
        }

        .action-btn.play:hover {
            background: rgba(0, 255, 102, 0.1);
        }

        .action-btn.star.active {
            color: #facc15;
            border-color: #facc15;
        }

        .action-btn.close:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        /* Unten fixierter Player / Display */
        footer {
            background: #111827;
            border-top: 2px solid #1f2937;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            bottom: 0;
            width: 100%;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.8);
        }

        .player-display-area {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .player-logo {
            width: 45px;
            height: 45px;
            border-radius: 4px;
            border: 1px solid #00ff66;
            object-fit: cover;
        }

        .player-text-screen {
            display: flex;
            flex-direction: column;
        }

        .player-song-info {
            font-size: 0.75rem;
            color: #facc15;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            min-height: 15px;
        }

        .player-station-name {
            font-size: 1rem;
            color: #ffffff;
            font-weight: bold;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        audio {
            height: 35px;
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Server Header -->
    <header>
        <div>
            <h1>LAUT.FM // CORE_DAEMON v2.6</h1>
        </div>
        <div class="server-rack-info">
            <div>HOST: <span style="color: #fff;">SRV-NODE-04</span></div>
            <div>STATUS: <span class="server-led"></span> ONLINE</div>
        </div>
    </header>

    <!-- Hauptbereich mit Suche -->
    <main>
        <div class="search-container">
            <h2>// SENDER-DATenbank DURCHSUCHEN</h2>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Sendernamen eingeben (z.B. ruhrpott, brian...) und Enter drücken..." autocomplete="off">
                <button class="search-btn" onclick="searchStations()">QUERY</button>
            </div>
        </div>

        <div id="resultsArea" class="station-grid">
            <!-- Suchergebnisse oder Favoriten erscheinen hier -->
        </div>
    </main>

    <!-- Unten fixierter Player -->
    <footer>
        <div class="player-display-area">
            <img id="playerLogo" class="player-logo" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='45'><rect width='45' height='45' fill='%231f2937'/></svg>" alt="Logo">
            <div class="player-text-screen">
                <div id="playerMeta" class="player-song-info">Warte auf Stream-Signal...</div>
                <div id="playerTitle" class="player-station-name">Kein Sender aktiv</div>
            </div>
        </div>
        <div class="player-controls">
            <audio id="audioPlayer" controls></audio>
        </div>
    </footer>

    <script>
        const searchInput = document.getElementById('searchInput');
        const resultsArea = document.getElementById('resultsArea');
        const audioPlayer = document.getElementById('audioPlayer');
        const playerLogo = document.getElementById('playerLogo');
        const playerTitle = document.getElementById('playerTitle');
        const playerMeta = document.getElementById('playerMeta');

        let currentMetaInterval = null;

        // Enter-Taste abfangen
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchStations();
            }
        });

        async function searchStations() {
            const query = searchInput.value.trim();
            if (!query) return;

            resultsArea.innerHTML = `<div style="color: #9ca3af; text-align: center; padding: 20px;">Lade Senderdaten...</div>`;

            try {
                // Laut.fm API für die Stationssuche
                const response = await fetch(`https://api.laut.fm/search/stations?query=${encodeURIComponent(query)}`);
                const stations = await response.json();

                displayResults(stations);
            } catch (error) {
                resultsArea.innerHTML = `<div style="color: #ef4444; text-align: center; padding: 20px;">Fehler beim Abrufen der Serverdaten.</div>`;
            }
        }

        function displayResults(stations) {
            resultsArea.innerHTML = '';

            if (stations.length === 0) {
                resultsArea.innerHTML = `<div style="color: #9ca3af; text-align: center; padding: 20px;">Keine Sender gefunden.</div>`;
                return;
            }

            stations.forEach(station => {
                const card = document.createElement('div');
                card.className = 'station-card';

                const logoUrl = station.images && station.images.station 
                    ? station.images.station 
                    : 'https://via.placeholder.com/50';

                card.innerHTML = `
                    <div class="station-info-left">
                        <img src="${logoUrl}" class="station-logo" alt="Logo">
                        <div class="station-details">
                            <h3>${escapeHtml(station.display_name || station.name)}</h3>
                            <a href="https://laut.fm/${station.name}" target="_blank">// Öffentliche Seite öffnen</a>
                        </div>
                    </div>
                    <div class="station-actions">
                        <button class="action-btn star" title="Als Favorit vormerken" onclick="toggleStar(this)">★</button>
                        <button class="action-btn play" title="Stream abspielen" onclick="playStation('${station.name}', '${escapeHtml(station.display_name || station.name)}', '${logoUrl}')">▶</button>
                        <button class="action-btn close" title="Aus Liste entfernen" onclick="this.closest('.station-card').remove()">✕</button>
                    </div>
                `;
                resultsArea.appendChild(card);
            });
        }

        function playStation(stationName, displayName, logoUrl) {
            // Stream-URL von laut.fm
            audioPlayer.src = `https://stream.laut.fm/${stationName}`;
            audioPlayer.play();

            // Unten im Display anzeigen
            playerLogo.src = logoUrl;
            playerTitle.textContent = displayName;

            // Alte Meta-Abfrage stoppen falls aktiv
            if (currentMetaInterval) clearInterval(currentMetaInterval);

            // Sofort einmal abrufen und dann alle 10 Sekunden aktualisieren
            fetchCurrentSong(stationName);
            currentMetaInterval = setInterval(() => fetchCurrentSong(stationName), 10000);
        }

        async function fetchCurrentSong(stationName) {
            try {
                const response = await fetch(`https://api.laut.fm/station/${stationName}/current_song`);
                const data = await response.json();
                
                if (data && data.artist && data.title) {
                    playerMeta.textContent = `${data.artist.name} - ${data.title}`;
                } else if (data && data.title) {
                    playerMeta.textContent = data.title;
                } else {
                    playerMeta.textContent = "Live Stream aktiv";
                }
            } catch (e) {
                playerMeta.textContent = "Stream läuft";
            }
        }

        function toggleStar(btn) {
            btn.classList.toggle('active');
        }

        function escapeHtml(text) {
            return text.replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
