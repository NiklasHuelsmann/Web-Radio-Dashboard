<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>LAUT.FM // CORE_DAEMON</title>
    <style>
        /* ... (Dein bisheriges CSS bleibt fast gleich, wir ändern nur die Footer-Logik) ... */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #0b0f19; color: #00ff66; min-height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(circle, rgba(0, 255, 102, 0.05) 1px, transparent 1px); background-size: 20px 20px; }
        
        header { background: #111827; border-bottom: 2px solid #1f2937; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        
        .main-container { flex: 1; max-width: 900px; width: 100%; margin: 30px auto; padding: 0 20px; }

        /* Custom Play Button Design */
        .big-play-btn {
            background: transparent;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 10px 25px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
        }
        .big-play-btn:hover { background: #00ff66; color: #000; }
        .big-play-btn.playing { border-color: #ff3300; color: #ff3300; }

        footer { background: #111827; border-top: 2px solid #1f2937; padding: 15px 30px; display: flex; align-items: center; gap: 20px; position: sticky; bottom: 0; }
        
        #hiddenAudio { display: none; }
    </style>
</head>
<body>

    <header>
        <h1>LAUT.FM // CORE_DAEMON</h1>
        <div>STATUS: <span id="statusLed" style="color:#00ff66;">ONLINE</span></div>
    </header>

    <div class="main-container">
        <div style="background: rgba(17, 24, 39, 0.9); padding: 25px; border: 1px solid #374151;">
            <input type="text" id="searchInput" placeholder="Sendernamen eingeben..." style="width: 70%; padding: 10px; background: #030712; border: 1px solid #4b5563; color: #00ff66;">
            <button onclick="searchStation()" class="big-play-btn">QUERY</button>
        </div>
        <div id="resultsArea" style="margin-top: 20px;"></div>
    </div>

    <footer>
        <button id="toggleBtn" class="big-play-btn" onclick="togglePlayback()">PLAY</button>
        <div style="flex:1;">
            <div id="playerTitle" style="font-weight:bold;">Kein Sender geladen</div>
            <div id="playerMeta" style="font-size: 0.8rem; color: #facc15;">-</div>
        </div>
    </footer>

    <!-- Das eigentliche Audio-Element ist versteckt -->
    <audio id="hiddenAudio"></audio>

    <script>
        const audio = document.getElementById('hiddenAudio');
        const toggleBtn = document.getElementById('toggleBtn');
        const playerTitle = document.getElementById('playerTitle');
        const playerMeta = document.getElementById('playerMeta');
        let currentStation = '';

        async function searchStation() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase().replace(/\s+/g, '-');
            try {
                const response = await fetch(`https://api.laut.fm/station/${query}`);
                const data = await response.json();
                
                // Ergebnis anzeigen (in den resultsArea wie vorher)
                document.getElementById('resultsArea').innerHTML = `
                    <div style="border:1px solid #374151; padding: 10px; display:flex; justify-content:space-between;">
                        <span>Sender: ${data.display_name}</span>
                        <button class="big-play-btn" onclick="loadStation('${data.name}', '${data.display_name}')">LADEN</button>
                    </div>`;
            } catch (e) { alert("Sender nicht gefunden."); }
        }

        function loadStation(name, display) {
            currentStation = name;
            audio.src = `https://stream.laut.fm/${name}`;
            playerTitle.textContent = display;
            togglePlayback(); // Startet direkt nach Laden
            updateMeta(name);
        }

        function togglePlayback() {
            if (audio.paused) {
                audio.play();
                toggleBtn.textContent = "STOP";
                toggleBtn.classList.add('playing');
            } else {
                audio.pause();
                toggleBtn.textContent = "PLAY";
                toggleBtn.classList.remove('playing');
            }
        }

        async function updateMeta(name) {
            const res = await fetch(`https://api.laut.fm/station/${name}/current_song`);
            const data = await res.json();
            playerMeta.textContent = `${data.artist.name} - ${data.title}`;
            setTimeout(() => updateMeta(name), 15000);
        }
    </script>
</body>
</html>
